name: Build Android APK

on:
  push:
    branches: ["main", "astra-ai-integration"]
  pull_request:
    branches: ["main", "astra-ai-integration"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # This prevents the 5-hour hang. It forces the runner to stop if it gets stuck.
    timeout-minutes: 60 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Clear unnecessary files from the runner to prevent the "No space left" error
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 2. Use the official Flutter setup action (faster and takes up less disk space)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      # These three steps previously ended in `|| true`, so a red analyzer, a
      # failing test, or unformatted code could not fail the build. That is how
      # 10 analyzer errors went unnoticed on this branch.
      #
      # `--no-fatal-infos` is a deliberate policy, not a suppression: the
      # remaining ~726 infos are style nits (constant_identifier_names,
      # avoid_print in CLI scripts). They are still printed in the log, but
      # only errors and warnings fail the build.
      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos

      # Two passes over the suite, deliberately.
      #
      # The first has no configuration and proves the app degrades instead of
      # crashing when nothing is defined. The second supplies defines so that
      # the compile-time branch of Env._resolve is actually covered - without
      # it, that precedence check can be deleted without any test noticing.
      - name: Run Tests (unconfigured)
        run: flutter test

      - name: Run Tests (configured)
        run: |
          flutter test \
            --dart-define=SUPABASE_URL="https://ci-placeholder.supabase.co" \
            --dart-define=SUPABASE_ANON_KEY="ci-placeholder-anon-key" \
            --dart-define=FIREBASE_API_KEY="ci-placeholder-api-key"

      # Build-time configuration.
      #
      # The app reads config from --dart-define, so a build with no defines
      # silently ships with push notifications and Firebase token refresh
      # disabled (both used to depend on a local-only .env that CI never had).
      #
      # These are passed as values rather than written into a file, and the
      # only required entries are keys that are public by design: SUPABASE_URL,
      # SUPABASE_ANON_KEY and FIREBASE_API_KEY. FIREBASE_API_KEY is already
      # committed in lib/firebase_options.dart, so the fallback below is not a
      # leak - it just keeps refresh working when the secret is unset.
      #
      # Do NOT add FIREBASE_SERVER_KEY, ASTRA_API_KEY or SARVAM_API_KEY here.
      # They grant server-side authority and would be embedded in the APK.
      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyDbeOvU5nkgLkYCc8CFMnlrK5duMQySKf0' }}
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Debug APK
        run: flutter build apk --debug

      # 3. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
