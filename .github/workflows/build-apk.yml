name: Build Android APK

on:
  push:
    branches: ["main", "astra-ai-integration"]
  pull_request:
    branches: ["main", "astra-ai-integration"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # This prevents the 5-hour hang. It forces the runner to stop if it gets stuck.
    timeout-minutes: 60 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Clear unnecessary files from the runner to prevent the "No space left" error
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 2. Use the official Flutter setup action (faster and takes up less disk space)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      # These three steps previously ended in `|| true`, so a red analyzer, a
      # failing test, or unformatted code could not fail the build. That is how
      # 10 analyzer errors went unnoticed on this branch.
      #
      # `--no-fatal-infos` is a deliberate policy, not a suppression: the
      # remaining ~726 infos are style nits (constant_identifier_names,
      # avoid_print in CLI scripts). They are still printed in the log, but
      # only errors and warnings fail the build.
      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Debug APK
        run: flutter build apk --debug

      # 3. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
